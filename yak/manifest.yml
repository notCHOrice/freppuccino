description: >
  Freppuccino makes implicit geometry (F-reps) available natively in Rhino 9.
  Create F-rep boxes, spheres, cylinders, cones, tori, ellipsoids, pyramids and custom FFunctions,
  blend them with smooth unions, subtractions and intersections, warp them with twist, bend and repeat,
  edit them live with the gumball and mesh them to clean meshes with FrepMesh.
  Run the Freppuccino command to open the panel. Requires Rhino 9 (Windows or Mac). MIT licensed.
url: "https://github.com/sampotter/freppuccino"
