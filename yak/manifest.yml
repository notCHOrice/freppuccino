description: >
  Freppuccino makes implicit geometry (F-reps) available natively in Rhino.
  Create F-rep primitives, blend them with smooth unions, subtractions and intersections,
  edit them live with the gumball and mesh them with FrepMesh. Requires Rhino 9.
